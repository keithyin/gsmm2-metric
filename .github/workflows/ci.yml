name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --verbose
      - name: Build release binary
        run: cargo build --release
      - name: Golden check (fasta/fastq)
        run: bash scripts/compare_golden.sh ./target/release/gsmm2-metric
      - name: Golden check (bam/fastq/msa)
        run: bash scripts/compare_bam_golden.sh ./target/release/gsmm2-metric
