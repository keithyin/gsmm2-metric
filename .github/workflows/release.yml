name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # v* tag:test 通过后发布 crates.io,并创建带二进制资产的 GitHub Release。
  # 需要 repo secret:CARGO_REGISTRY_TOKEN(crates.io API token)。
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ubuntu runner 预装的 rustc 版本偏旧(edition 2024 需要 >= 1.85)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Package binary
        run: tar czf "gsmm2-metric-${{ github.ref_name }}-x86_64-linux.tar.gz" -C target/release gsmm2-metric

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "gsmm2-metric-${{ github.ref_name }}-x86_64-linux.tar.gz" \
            --title "gsmm2-metric ${{ github.ref_name }}" \
            --generate-notes
