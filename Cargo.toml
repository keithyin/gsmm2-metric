[package]
name = "gsmm2-metric"
version = "0.11.0"
edition = "2024"
description = "gsmm2 metric"
license = "MIT"
repository = "https://github.com/keithyin/gsmm2-metric"
exclude = ["test_data/*", ".claude", "bug-report.md", "refact.md", "demo.txt"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
bandmap-core = "2.0.0"
num_cpus = "1.16"
hp_tr_finder = "0.5.0"
crossbeam = "0.8"
indicatif = "0.17"
noodles = { version = "0.119", features = ["bam", "bgzf", "core", "sam", "fasta", "fastq"] }
once_cell = "1"
regex = "1"
lazy_static = "1.5.0"
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = {version="0.3.18", features=["json", "env-filter", "fmt", "time", "local-time"]}
time = "0.3.34"